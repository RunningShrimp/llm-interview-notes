<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="面向 6 年后端工程师转型 AI 应用方向的系统面试备考手册：L1-L9 九层知识体系，基础篇 + 进阶篇，覆盖 LLM 应用基础、Prompt 与 Context 工程、RAG、Agent、评测体系与生产化。" />
  <title>AI 应用工程师面试备考</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c2733'/%3E%3Ctext x='16' y='22' font-family='Menlo,monospace' font-size='13' font-weight='700' fill='%23e8eef7' text-anchor='middle'%3EAI%3C/text%3E%3Crect x='6' y='26' width='20' height='2' rx='1' fill='%232c5fb2'/%3E%3C/svg%3E" />

  <style>
    :root {
      --accent:        #2c5fb2;   /* 钢笔墨蓝：链接 / 强调 */
      --accent-deep:   #1d4486;
      --accent-wash:   #eef3fa;   /* 极浅蓝底：引用块 / 行内代码 */
      --ink:           #24292f;   /* 正文 */
      --ink-soft:      #57606a;   /* 次级文字 */
      --paper:         #ffffff;
      --paper-soft:    #f6f7f9;   /* 代码块底 */
      --line:          #e4e7ec;   /* 分隔线 / 表格边框 */
      --sidebar-bg:    #1c2733;   /* 深墨蓝侧栏 */
      --sidebar-bg-2:  #16202b;
      --sidebar-ink:   #aab8c8;
      --sidebar-ink-dim: #6b7d92;
      --sidebar-hover: #e8eef7;
      --mono: 'Sarasa Mono SC', 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas,
              'Noto Sans Mono CJK SC', 'Source Han Mono SC',
              'PingFang SC', 'Microsoft YaHei', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC',
              'Hiragino Sans GB', 'Microsoft YaHei', 'Source Han Sans SC',
              'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection { background: rgba(44, 95, 178, .22); }

    /* ============ 加载占位 ============ */
    #app > loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: var(--ink-soft); letter-spacing: .12em;
    }

    /* ============ 侧栏（深墨蓝） ============ */
    .sidebar {
      background: linear-gradient(180deg, var(--sidebar-bg) 0%, var(--sidebar-bg-2) 100%);
      font-family: var(--sans);
      border-right: 1px solid rgba(255, 255, 255, .06);
      transition: transform .25s ease;
    }

    .app-name {
      padding: 28px 24px 18px;
      background: transparent;
    }
    .app-name a {
      color: #f0f4f9;
      font-size: 16.5px;
      font-weight: 700;
      letter-spacing: .02em;
      text-decoration: none;
    }
    .app-name a:hover { color: #fff; }

    .sidebar .sidebar-nav {
      padding: 4px 14px 40px;
    }
    .sidebar .sidebar-nav ul {
      padding-left: 0;
      margin: 0 0 4px;
      list-style: none;
    }
    .sidebar .sidebar-nav > ul { margin-left: 0; }
    .sidebar .sidebar-nav ul ul { padding-left: 14px; }

    /* 分组标题（无链接的条目） */
    .sidebar .sidebar-nav ul li {
      margin: 0;
      line-height: 1;
    }
    .sidebar .sidebar-nav ul li strong,
    .sidebar .sidebar-nav ul li p {
      display: block;
      margin: 14px 0 2px;
      padding: 0 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--sidebar-ink-dim);
      letter-spacing: .14em;
    }
    .sidebar .sidebar-nav ul li a {
      display: block;
      padding: 6px 8px;
      margin: 1px 0;
      border-left: 2px solid transparent;
      border-radius: 4px;
      color: var(--sidebar-ink);
      font-size: 13.5px;
      line-height: 1.45;
      text-decoration: none;
      transition: color .15s, background .15s;
    }
    .sidebar .sidebar-nav ul li a:hover {
      color: var(--sidebar-hover);
      background: rgba(255, 255, 255, .05);
    }
    .sidebar .sidebar-nav ul li.active > a {
      color: #fff;
      background: rgba(44, 95, 178, .28);
      border-left-color: #5b8ad6;
      font-weight: 600;
    }
    /* subMaxLevel 自动生成的二级标题子链接 */
    .sidebar .sidebar-nav ul li ul li a {
      font-size: 12.5px;
      color: var(--sidebar-ink-dim);
      padding: 4px 8px 4px 18px;
    }
    .sidebar .sidebar-nav ul li ul li a:hover { color: var(--sidebar-hover); }
    .sidebar .sidebar-nav ul li ul li.active > a {
      color: #cfe0f5;
      background: transparent;
      border-left-color: #3c659f;
      font-weight: 500;
    }

    /* ============ 侧栏搜索（中文全文搜索） ============ */
    .sidebar .search {
      margin: 0 16px 12px;
      border-bottom: none;
    }
    .sidebar .search .input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 6px;
    }
    .sidebar .search .input-wrap input {
      background: transparent;
      color: var(--sidebar-hover);
      font-size: 13px;
      font-family: var(--sans);
      padding: 8px 10px;
      min-width: 0;
    }
    .sidebar .search .input-wrap input::placeholder { color: var(--sidebar-ink-dim); }
    .sidebar .search .input-wrap input:focus {
      outline: none;
      border-color: transparent;
    }
    .sidebar .search .input-wrap .clear-button {
      padding: 0 10px;
      opacity: .55;
      cursor: pointer;
    }
    .sidebar .search .clear-button svg circle { fill: var(--sidebar-ink-dim); }

    .sidebar .search .results-panel {
      max-height: 46vh;
      overflow-y: auto;
      border-radius: 6px;
      background: rgba(0, 0, 0, .18);
    }
    .sidebar .search .results-panel .matching-post {
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      padding: 8px 12px;
    }
    .sidebar .search .results-panel .matching-post:last-child { border-bottom: none; }
    .sidebar .search .matching-post a {
      color: var(--sidebar-ink);
      text-decoration: none;
      font-size: 12.5px;
    }
    .sidebar .search .matching-post h2 {
      margin: 0 0 3px;
      font-size: 12.5px;
      font-weight: 600;
      color: #cdd9e6;
      padding: 0;
      border: none;
    }
    .sidebar .search .matching-post h2 em,
    .sidebar .search .matching-post p em {
      color: #8fb6ea;
      font-style: normal;
      font-weight: 600;
    }
    .sidebar .search .matching-post p {
      margin: 0;
      color: var(--sidebar-ink-dim);
      font-size: 12px;
      line-height: 1.6;
    }
    .sidebar .search .results-panel .empty {
      color: var(--sidebar-ink-dim);
      font-size: 12.5px;
      text-align: center;
      padding: 14px 0;
    }

    /* ============ 内容区 ============ */
    .content, .content .markdown-section {
      background: var(--paper);
    }
    .markdown-section {
      position: relative;
      max-width: 960px;              /* 宽表格 / ASCII 图，放宽阅读栏 */
      padding: 36px 56px 96px;
      font-size: 15.5px;
      line-height: 1.78;
      color: var(--ink);
    }
    .markdown-section::before {
      content: '';
      position: absolute;
      top: 0; left: 56px; right: 56px;
      height: 3px;
      border-radius: 0 0 2px 2px;
      background: linear-gradient(90deg, var(--accent) 0%, #6f94cc 46%, transparent 90%);
      opacity: .85;
    }

    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section h5 {
      font-weight: 700;
      color: #1a222c;
      letter-spacing: .01em;
    }
    .markdown-section h1 {
      margin: 0 0 22px;
      font-size: 27px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .markdown-section h2 {
      margin: 40px 0 14px;
      font-size: 21px;
      padding: 8px 0 8px 14px;
      border-left: 4px solid var(--accent);
      background: linear-gradient(90deg, var(--accent-wash), transparent 72%);
      border-radius: 0 4px 4px 0;
    }
    .markdown-section h3 {
      margin: 30px 0 10px;
      font-size: 17.5px;
      color: var(--accent-deep);
    }
    .markdown-section h4 { margin: 24px 0 8px; font-size: 15.5px; }

    .markdown-section p { margin: 12px 0; }
    .markdown-section a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(44, 95, 178, .3);
      transition: color .15s, border-color .15s;
    }
    .markdown-section a:hover {
      color: var(--accent-deep);
      border-bottom-color: var(--accent-deep);
    }
    .markdown-section strong { color: #1a222c; font-weight: 700; }
    .markdown-section hr {
      height: 1px;
      border: none;
      background: var(--line);
      margin: 36px 0;
    }
    .markdown-section ul li, .markdown-section ol li { margin: 5px 0; }

    /* 引用块：内容里大量"小结/心法"引用 */
    .markdown-section blockquote {
      margin: 16px 0;
      padding: 10px 18px;
      border: none;
      border-left: 4px solid var(--accent);
      border-radius: 0 4px 4px 0;
      background: var(--accent-wash);
      color: #3b4a5c;
    }
    .markdown-section blockquote p { margin: 6px 0; }

    /* ============ 代码：ASCII 图硬需求 ============ */
    .markdown-section code,
    .markdown-section pre,
    .markdown-section kbd {
      font-family: var(--mono);
    }
    .markdown-section code {
      border-radius: 4px;
      background: #edf0f4;
      color: #33445c;
      padding: 2px 6px;
      font-size: .88em;
    }
    .markdown-section pre {
      position: relative;
      background: var(--paper-soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px 18px;
      margin: 16px 0;
      line-height: 1.62;
      font-size: 13px;
      tab-size: 4;
    }
    .markdown-section pre code {
      /* ASCII 架构图一折行就废：强制不折行，横向滚动 */
      white-space: pre !important;
      word-wrap: normal !important;
      overflow-wrap: normal !important;
      background: transparent;
      padding: 0;
      color: #2b3440;
      font-size: 13px;
      font-weight: 400;
      line-height: inherit;
    }
    .markdown-section pre { overflow-x: auto; }
    /* 细滚动条，别喧宾夺主 */
    .markdown-section pre::-webkit-scrollbar { height: 8px; width: 8px; }
    .markdown-section pre::-webkit-scrollbar-thumb {
      background: #c9d1dc;
      border-radius: 4px;
    }
    .markdown-section pre::-webkit-scrollbar-thumb:hover { background: #aeb9c7; }
    .markdown-section pre::-webkit-scrollbar-track { background: transparent; }

    /* ============ 表格：多且宽 ============ */
    .markdown-section table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 18px 0;
      font-size: 14px;
      line-height: 1.65;
    }
    .markdown-section table::-webkit-scrollbar { height: 8px; }
    .markdown-section table::-webkit-scrollbar-thumb {
      background: #c9d1dc; border-radius: 4px;
    }
    .markdown-section table th,
    .markdown-section table td {
      border: 1px solid var(--line);
      padding: 8px 14px;
    }
    .markdown-section table th {
      background: #f2f4f8;
      font-weight: 700;
      color: #2a3441;
      white-space: nowrap;
    }
    .markdown-section table tr:nth-child(2n) { background: #fafbfd; }
    .markdown-section table td code { font-size: .85em; }

    .markdown-section img { max-width: 100%; }

    /* 回到顶部 */
    body > .back-to-top {
      background: var(--sidebar-bg);
      color: #d5e0ee;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(22, 32, 43, .28);
    }

    /* ============ 封面 ============ */
    section.cover {
      align-items: center;
      text-align: center;
      background:
        radial-gradient(1100px 480px at 50% 118%, rgba(44, 95, 178, .24), transparent 68%),
        linear-gradient(168deg, #1a2634 0%, #141d28 58%, #101823 100%);
      min-height: 100vh;
      color: #c7d2e0;
    }
    section.cover .cover-main {
      max-width: 760px;
      padding: 0 28px 40px;
      margin-top: -4vh;
    }
    section.cover .cover-main h1 {
      margin: 0 0 6px;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.22;
      letter-spacing: .04em;
      font-weight: 800;
      color: #f3f7fc;
      font-family: var(--sans);
      border: none;
      padding: 0;
    }
    section.cover .cover-main h1 small {
      display: block;
      margin-top: 14px;
      font-size: clamp(16px, 2.4vw, 21px);
      font-weight: 500;
      letter-spacing: .34em;
      text-indent: .34em; /* 抵消最后一字字距，保证视觉居中 */
      color: #7e97b8;
      -webkit-font-smoothing: antialiased;
    }
    section.cover .cover-main h1 a { color: inherit; border-bottom: none; }
    section.cover .cover-main blockquote {
      margin: 26px auto 8px;
      max-width: 560px;
      border: none;
      background: transparent;
      color: #93a5bb;
      font-size: 15px;
      line-height: 1.9;
      letter-spacing: .02em;
    }
    section.cover .cover-main blockquote p { margin: 0; }

    /* 亮点词条 */
    section.cover .cover-tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 30px 0 6px;
    }
    section.cover .cover-tags span {
      display: inline-block;
      padding: 7px 18px;
      border: 1px solid rgba(126, 151, 184, .42);
      border-radius: 999px;
      color: #aebfd6;
      font-size: 13px;
      letter-spacing: .08em;
      background: rgba(255, 255, 255, .03);
    }

    /* CTA 按钮 */
    section.cover .cover-cta {
      margin: 40px 0 0;
    }
    section.cover .cover-cta a {
      display: inline-block;
      padding: 13px 40px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: .14em;
      text-decoration: none;
      box-shadow: 0 6px 22px rgba(44, 95, 178, .38);
      transition: background .18s, transform .18s, box-shadow .18s;
    }
    section.cover .cover-cta a:hover {
      background: var(--accent-deep);
      border-color: var(--accent-deep);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(44, 95, 178, .48);
      color: #fff;
    }

    /* 封面底部 meta */
    section.cover .cover-meta {
      margin: 46px 0 0;
      color: #5c718c;
      font-size: 12.5px;
      letter-spacing: .12em;
    }
    section.cover .cover-meta .sep { margin: 0 10px; opacity: .5; }

    /* 侧栏弹出按钮（移动端） */
    body .sidebar-toggle {
      background: var(--sidebar-bg);
      border-radius: 0 6px 6px 0;
      width: 30px; height: 30px;
    }
    body .sidebar-toggle span {
      background-color: #c9d6e5;
      border-radius: 1px;
    }
    body.close .sidebar-toggle span { background-color: #c9d6e5; }

    /* ============ 移动端 ============ */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 24px 22px 72px;
        font-size: 15px;
      }
      .markdown-section::before { left: 22px; right: 22px; }
      .markdown-section h1 { font-size: 23px; }
      .markdown-section h2 { font-size: 18.5px; }
      .markdown-section pre { font-size: 12px; padding: 12px; border-radius: 6px; }
      .markdown-section pre code { font-size: 12px; }
    }

    /* 打印：去掉侧栏，A4 友好 */
    @media print {
      .sidebar, .sidebar-toggle, body > .back-to-top { display: none !important; }
      .content { left: 0 !important; }
      .markdown-section { max-width: 100%; padding: 0; }
      .markdown-section pre { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <div id="app">正在加载……</div>

  <script>
    window.$docsify = {
      // 站点名（显示在侧栏顶部，点击回到首页）
      name: 'AI 应用工程师 · 面试备考',
      nameLink: '/',

      // GitHub 角标（封面左上角展示）。当前留空不显示。
      // 发布到 GitHub 后，取消下一行注释并替换为你的仓库地址即可，例如：
      // repo: 'https://github.com/yourname/al_project_interview',
      repo: '',

      loadSidebar: true,      // 侧边栏：_sidebar.md（分组导航）
      loadNavbar: false,      // 不启用顶部导航
      coverpage: true,        // 封面：_coverpage.md
      subMaxLevel: 2,         // 侧栏自动收录二级标题，方便长文跳转
      auto2top: true,         // 切换页面自动回到顶部
      relativePath: true,     // 重要：启用相对路径解析，配合分类文件夹的链接
      externalLinkTarget: '_blank',  // 外链一律新标签打开

      // 中文全文搜索（Docsify search 插件内置中文分词支持）
      search: {
        placeholder: '搜索',
        noData: '未找到相关内容',
        depth: 4
      }
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
